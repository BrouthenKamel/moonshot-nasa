<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assembly bay mockup</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03050a; color: #e2e8f0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .chip { position: fixed; top: 8px; left: 12px; background: rgba(2,6,23,.7); border: 1px solid rgba(148,163,184,.22);
    border-radius: 10px; padding: 5px 10px; font-size: 12px; color: #94a3b8; }
  .chip b { color: #e2e8f0; }
  .tray { position: fixed; left: 12px; right: 12px; bottom: 10px; display: grid; grid-template-columns: 1.1fr 1.1fr .9fr .9fr 1.6fr; gap: 8px; }
  .bin { background: rgba(2,6,23,.82); border: 1px solid rgba(148,163,184,.22); border-radius: 12px; padding: 8px; backdrop-filter: blur(6px); }
  .bin h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .opts button { font: inherit; font-size: 12px; text-align: left; padding: 5px 8px; border-radius: 8px; cursor: pointer; flex: 1 1 auto;
    border: 1px solid rgba(148,163,184,.3); background: rgba(15,23,42,.8); color: #cbd5e1; }
  .opts button small { display: block; color: #64748b; font-size: 10.5px; margin-top: 1px; }
  .opts button.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; color: #fff; }
  .opts button:hover { background: rgba(30,41,59,.9); }
  .err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px; text-align: center; color: #fca5a5; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="chip"><b>Assembly bay mockup.</b> Pick parts from the bins below. Drag the picture to turn the satellite.</div>
<div class="tray" id="tray"></div>
<div class="err" id="err">The 3D mockup could not load (it needs an internet connection for the 3D library).</div>

<script type="module">
import * as THREE from 'three';

/* ---------- parts (numbers copied from src/data/parts.ts) ---------- */
const CATS = [
  { key: 'solar', title: 'Solar panels', color: '#3b82f6', opts: [
    { id: 'body', name: 'Body panels', mass: .4, vol: 0, cost: .15, effort: 1, gen: 20 },
    { id: 'wing1', name: 'Deployable wings', mass: 1.3, vol: 0, cost: .6, effort: 3, gen: 84 },
    { id: 'wing2', name: 'Large array', mass: 2.0, vol: 0, cost: 1.0, effort: 4, gen: 120 } ] },
  { key: 'battery', title: 'Battery', color: '#22c55e', opts: [
    { id: 's', name: 'Small', mass: .2, vol: .1, cost: .05, effort: 1, wh: 20 },
    { id: 'm', name: 'Medium', mass: .3, vol: .15, cost: .1, effort: 1, wh: 40 },
    { id: 'l', name: 'Large', mass: .6, vol: .3, cost: .2, effort: 1, wh: 80 } ] },
  { key: 'computer', title: 'Flight computer', color: '#a855f7', opts: [
    { id: 'basic', name: 'Basic', mass: .2, vol: .2, cost: .3, effort: 2, draw: 3 },
    { id: 'red', name: 'Rad-hard, redundant', mass: .4, vol: .3, cost: .9, effort: 4, draw: 5 } ] },
  { key: 'attitude', title: 'Attitude control', color: '#06b6d4', opts: [
    { id: 'basic', name: 'Basic', mass: .5, vol: .3, cost: .3, effort: 2, draw: 2 },
    { id: 'prec', name: 'Precision + star tracker', mass: .9, vol: .5, cost: .8, effort: 4, draw: 3 } ] },
  { key: 'propulsion', title: 'Propulsion', color: '#f59e0b', opts: [
    { id: 'cold', name: 'Cold gas', mass: .5, vol: .4, cost: .1, effort: 2, prop: .3, kind: 'cold' },
    { id: 'chem2', name: 'Green mono, 2 kg', mass: 3.6, vol: 2.4, cost: 2.5, effort: 9, prop: 2, kind: 'chem' },
    { id: 'chem3', name: 'Green mono, 3 kg', mass: 3.6, vol: 2.9, cost: 2.5, effort: 9, prop: 3, kind: 'chem' },
    { id: 'ion1', name: 'Ion, 1.0 kg', mass: 1.4, vol: 1.5, cost: 3.0, effort: 10, prop: 1, kind: 'ion' },
    { id: 'ion15', name: 'Ion, 1.5 kg', mass: 1.4, vol: 1.6, cost: 3.0, effort: 10, prop: 1.5, kind: 'ion' } ] },
];
const FIXED = { bus: { mass: 2.2, cost: 1.0, effort: 4, draw: 3 },
  inst: { name: 'IR spectrometer', mass: 3.2, vol: 1.5, cost: 3.0, effort: 9, draw: 12 },
  radio: { name: 'Deep-space radio, patch', mass: 1.2, vol: .5, cost: 1.55, effort: 5, draw: 10 } };
const sel = { solar: 'wing2', battery: 'l', computer: 'basic', attitude: 'basic', propulsion: 'ion15' };
const pick = (k) => CATS.find(c => c.key === k).opts.find(o => o.id === sel[k]);

function numbers() {
  const p = { solar: pick('solar'), battery: pick('battery'), computer: pick('computer'), attitude: pick('attitude'), propulsion: pick('propulsion') };
  const chosen = Object.values(p);
  const dry = FIXED.bus.mass + FIXED.inst.mass + FIXED.radio.mass + chosen.reduce((s, x) => s + x.mass, 0);
  const mass = dry + p.propulsion.prop;
  const vol = FIXED.inst.vol + FIXED.radio.vol + chosen.reduce((s, x) => s + x.vol, 0);
  const bus = FIXED.bus.draw + FIXED.radio.draw + p.computer.draw + p.attitude.draw;
  const used = bus + FIXED.inst.draw, gen = p.solar.gen;
  const effort = FIXED.bus.effort + FIXED.inst.effort + FIXED.radio.effort + chosen.reduce((s, x) => s + x.effort, 0);
  const cost = FIXED.bus.cost + FIXED.inst.cost + FIXED.radio.cost + chosen.reduce((s, x) => s + x.cost, 0);
  const thrust = gen * .75 - bus;
  const band = (spare) => spare >= .15 ? 'ok' : spare >= 0 ? 'warn' : 'bad';
  const alerts = [];
  if (mass > 14) alerts.push(['bad', `TOO HEAVY BY ${(mass - 14).toFixed(1)} KG`]);
  if (vol > 6) alerts.push(['bad', `DOES NOT FIT: ${(vol - 6).toFixed(1)} U TOO MUCH`]);
  if (used > gen) alerts.push(['bad', `NOT ENOUGH POWER: SHORT ${used - gen} W`]);
  if (p.propulsion.kind === 'ion' && thrust < 56) alerts.push(['bad', `ION ENGINE NEEDS 56 W, GETS ${Math.max(0, thrust).toFixed(0)} W`]);
  if (p.propulsion.kind === 'cold') alerts.push(['warn', 'COLD GAS CANNOT BRAKE AT THE MOON']);
  return { p, mass, dry, vol, used, gen, bus, effort, months: Math.ceil(effort / 10), cost, thrust, alerts,
    sMass: band((14 - mass) / 14), sVol: band((6 - vol) / 6), sPow: band((gen - used) / gen) };
}

/* ---------- scene ---------- */
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); } catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color('#03050a');
scene.fog = new THREE.Fog('#03050a', 14, 34);
const camera = new THREE.PerspectiveCamera(40, 1, .1, 100);

scene.add(new THREE.AmbientLight('#8fa3c8', .55));
const key = new THREE.SpotLight('#dbeafe', 260, 30, .5, .5); key.position.set(-3, 11, 6); key.target.position.set(-2.4, 2, 0); scene.add(key, key.target);
const rim = new THREE.PointLight('#f59e0b', 30, 14); rim.position.set(-7, 3, -2); scene.add(rim);
const fill = new THREE.PointLight('#38bdf8', 26, 16); fill.position.set(3, 5, 5); scene.add(fill);

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .6, metalness: .25, ...o });
// room
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), M('#0b1220', { roughness: .35, metalness: .5 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(60, 60, '#1e3a5f', '#101c30'); grid.position.y = .01; scene.add(grid);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 16), M('#0a101c')); wall.position.set(0, 8, -5); scene.add(wall);
for (let i = -4; i <= 4; i++) { const rib = new THREE.Mesh(new THREE.BoxGeometry(.25, 16, .3), M('#111a2c')); rib.position.set(i * 3.4, 8, -4.85); scene.add(rib); }
for (const x of [-8, 0, 8]) { const strip = new THREE.Mesh(new THREE.BoxGeometry(5, .08, .5), new THREE.MeshBasicMaterial({ color: '#cfe4ff' })); strip.position.set(x, 9.2, 1); scene.add(strip); }
// gantry
const rail = new THREE.Mesh(new THREE.BoxGeometry(14, .3, .4), M('#1f2a3d', { metalness: .7 })); rail.position.set(-2.4, 7.2, 0); scene.add(rail);
const hoist = new THREE.Group(); scene.add(hoist);
const trolley = new THREE.Mesh(new THREE.BoxGeometry(.9, .35, .7), M('#f59e0b')); trolley.position.y = 6.9; hoist.add(trolley);
const cable = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, 1, 6), M('#94a3b8')); hoist.add(cable);
const hook = new THREE.Mesh(new THREE.BoxGeometry(.5, .12, .5), M('#94a3b8', { metalness: .8 })); hoist.add(hook);
hoist.position.x = -2.4;

// stand + turntable
const SAT_X = -2.4, BASE_Y = 1.5;
const plinth = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.3, .5, 48), M('#141d2e', { metalness: .6 })); plinth.position.set(SAT_X, .25, 0); scene.add(plinth);
const ringMat = new THREE.MeshBasicMaterial({ color: '#22c55e' });
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.12, .04, 8, 64), ringMat); ring.rotation.x = Math.PI / 2; ring.position.set(SAT_X, .52, 0); scene.add(ring);
const turn = new THREE.Group(); turn.position.set(SAT_X, 0, 0); scene.add(turn);
for (const sx of [-.7, .7]) { const post = new THREE.Mesh(new THREE.BoxGeometry(.12, BASE_Y - .5, .12), M('#334155', { metalness: .7 })); post.position.set(sx, (BASE_Y + .5) / 2, -.62); turn.add(post); }
const cradle = new THREE.Mesh(new THREE.BoxGeometry(2.3, .1, .2), M('#334155', { metalness: .7 })); cradle.position.set(0, BASE_Y - .05, -.62); turn.add(cradle);
const sat = new THREE.Group(); sat.position.y = BASE_Y; turn.add(sat);

// frame: 2 wide x 3 high x 1 deep = 6U
const frameMat = new THREE.LineBasicMaterial({ color: '#7dd3fc' });
const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2, 3, 1)), frameMat); frame.position.y = 1.5; sat.add(frame);
const cellLines = new THREE.Group(); sat.add(cellLines);
for (const y of [1, 2]) { const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-1, y, .5), new THREE.Vector3(1, y, .5), new THREE.Vector3(1, y, -.5), new THREE.Vector3(-1, y, -.5), new THREE.Vector3(-1, y, .5)]); cellLines.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: '#1e4d6b' }))); }
const back = new THREE.Mesh(new THREE.BoxGeometry(2, 3, .04), M('#1e293b', { metalness: .6 })); back.position.set(0, 1.5, -.5); sat.add(back);
for (const y of [0, 3]) { const cap = new THREE.Mesh(new THREE.BoxGeometry(2.06, .05, 1.06), M('#475569', { metalness: .7 })); cap.position.y = y; sat.add(cap); }

function label(text, sub, color) {
  const c = document.createElement('canvas'); c.width = 768; c.height = 192; const g = c.getContext('2d');
  g.fillStyle = 'rgba(2,6,23,.55)'; g.fillRect(0, 0, 768, 192);
  g.fillStyle = color; g.fillRect(0, 0, 14, 192);
  g.fillStyle = '#fff'; g.font = '600 62px system-ui, sans-serif'; g.textBaseline = 'middle'; g.fillText(text, 34, sub ? 66 : 96);
  if (sub) { g.fillStyle = '#cbd5e1'; g.font = '40px system-ui, sans-serif'; g.fillText(sub, 34, 136); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// blocks, bottom to top
const ORDER = ['propulsion', 'inst', 'radio', 'attitude', 'computer', 'battery'];
const COLORS = { propulsion: '#f59e0b', inst: '#64748b', radio: '#64748b', attitude: '#06b6d4', computer: '#a855f7', battery: '#22c55e' };
const blocks = {};
for (const k of ORDER) {
  const g = new THREE.Group(); sat.add(g);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1, .9), M(COLORS[k], { emissive: COLORS[k], emissiveIntensity: .12 })); g.add(mesh);
  const tag = new THREE.Mesh(new THREE.PlaneGeometry(1.8, .45), new THREE.MeshBasicMaterial({ transparent: true })); tag.position.z = .46; g.add(tag);
  blocks[k] = { g, mesh, tag, y: 0, h: .01, ty: 0, th: .01, drop: 0, id: '' };
}
const over = new THREE.Mesh(new THREE.BoxGeometry(1.96, 1, .96), new THREE.MeshBasicMaterial({ color: '#ef4444', transparent: true, opacity: .35 })); sat.add(over);

// outside parts
const cellMat = M('#1d4ed8', { emissive: '#1e40af', emissiveIntensity: .5, metalness: .6, roughness: .3 });
const body = new THREE.Group(); sat.add(body);
for (const sx of [-1, 1]) { const b = new THREE.Mesh(new THREE.BoxGeometry(.04, 2.8, .9), cellMat); b.position.set(sx * 1.03, 1.5, 0); body.add(b); }
const wings = [];
for (const sx of [-1, 1]) {
  const w = new THREE.Group(); w.position.set(sx, 1.5, -.3); sat.add(w);
  const segs = [];
  for (let i = 0; i < 2; i++) {
    const s = new THREE.Group(); s.position.x = sx * i * 1.2; w.add(s);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(1.14, 2.7, .04), cellMat); panel.position.x = sx * .6; s.add(panel);
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.14, .9, .05)), new THREE.LineBasicMaterial({ color: '#93c5fd' }));
    for (const dy of [-.9, 0, .9]) { const l = lines.clone(); l.position.set(sx * .6, dy, 0); s.add(l); }
    segs.push({ s, k: 0, t: 0 });
  }
  wings.push({ w, sx, segs });
}
const tracker = new THREE.Group(); tracker.position.set(1.0, 2.5, .2); sat.add(tracker);
{ const tube = new THREE.Mesh(new THREE.CylinderGeometry(.13, .16, .5, 16), M('#0e7490', { metalness: .7 })); tube.rotation.z = -Math.PI / 2.6; tube.position.x = .25; tracker.add(tube);
  const lens = new THREE.Mesh(new THREE.SphereGeometry(.1, 12, 12), new THREE.MeshBasicMaterial({ color: '#67e8f9' })); lens.position.set(.47, .12, 0); tracker.add(lens); }
const patch = new THREE.Mesh(new THREE.BoxGeometry(.7, .7, .05), M('#94a3b8', { metalness: .8 })); patch.position.set(.45, 3.06, 0); patch.rotation.x = Math.PI / 2; sat.add(patch);
const nozzles = new THREE.Group(); sat.add(nozzles);
const glow = new THREE.PointLight('#60a5fa', 0, 4); glow.position.y = -.5; sat.add(glow);
function buildNozzles(kind) {
  nozzles.clear();
  if (kind === 'ion') {
    const n = new THREE.Mesh(new THREE.CylinderGeometry(.42, .5, .3, 32), M('#475569', { metalness: .8 })); n.position.y = -.15; nozzles.add(n);
    const d = new THREE.Mesh(new THREE.CircleGeometry(.4, 32), new THREE.MeshBasicMaterial({ color: '#7dd3fc' })); d.rotation.x = Math.PI / 2; d.position.y = -.31; nozzles.add(d);
  } else {
    const r = kind === 'chem' ? .2 : .09, h = kind === 'chem' ? .4 : .18;
    for (const [x, z] of [[-.6, -.25], [.6, -.25], [-.6, .25], [.6, .25]]) { const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 16, 1, true), M('#cbd5e1', { metalness: .9, side: THREE.DoubleSide })); c.position.set(x, -h / 2, z); nozzles.add(c); }
  }
}

/* ---------- wall board ---------- */
const bc = document.createElement('canvas'); bc.width = 1500; bc.height = 1050; const bg = bc.getContext('2d');
const btex = new THREE.CanvasTexture(bc); btex.colorSpace = THREE.SRGBColorSpace;
const board = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 4.62), new THREE.MeshBasicMaterial({ map: btex })); board.position.set(4.3, 3.9, -3.2); board.rotation.y = -.22; scene.add(board);
const bezel = new THREE.Mesh(new THREE.BoxGeometry(6.9, 4.9, .15), M('#0f172a', { metalness: .6 })); bezel.position.copy(board.position); bezel.position.z -= .1; bezel.rotation.y = -.22; scene.add(bezel);
const SC = { ok: '#22c55e', warn: '#f59e0b', bad: '#ef4444' };
const shown = { mass: 0, vol: 0, used: 0, gen: 0, cost: 0 };
function paintBoard(n, t) {
  const g = bg; g.fillStyle = '#050a14'; g.fillRect(0, 0, 1500, 1050);
  g.fillStyle = '#94a3b8'; g.font = '600 38px system-ui'; g.textBaseline = 'alphabetic';
  g.fillText('FACTORY · ASSEMBLY BAY 1 · LUNAR ICE MAPPER', 50, 70);
  const bar = (y, title, val, lim, unit, st, txt) => {
    g.fillStyle = '#cbd5e1'; g.font = '600 44px system-ui'; g.fillText(title, 50, y);
    g.fillStyle = SC[st]; g.font = '700 64px system-ui'; g.textAlign = 'right'; g.fillText(txt, 1450, y + 6); g.textAlign = 'left';
    g.fillStyle = '#111c2e'; g.fillRect(50, y + 26, 1400, 56);
    const w = 1400 / 1.25; // limit sits at 80% of the bar
    g.fillStyle = SC[st]; g.fillRect(50, y + 26, Math.min(1400, w * val / lim), 56);
    g.fillStyle = '#e2e8f0'; g.fillRect(50 + w - 3, y + 14, 6, 80);
    g.fillStyle = '#64748b'; g.font = '30px system-ui'; g.fillText(`limit ${lim} ${unit}`, 50 + w + 14, y + 118);
  };
  bar(170, 'MASS, FUELLED', shown.mass, 14, 'kg', n.sMass, `${shown.mass.toFixed(1)} / 14 kg`);
  bar(380, 'VOLUME IN THE BOX', shown.vol, 6, 'U', n.sVol, `${shown.vol.toFixed(1)} / 6 U`);
  bar(590, 'POWER IN SUNLIGHT', shown.used, Math.max(1, shown.gen), 'W made', n.sPow, `uses ${shown.used.toFixed(0)} of ${shown.gen.toFixed(0)} W`);
  g.fillStyle = '#cbd5e1'; g.font = '600 40px system-ui';
  g.fillText(`PARTS  $${shown.cost.toFixed(1)}M`, 50, 830); g.fillText(`BUILD TIME  ${n.months} MONTHS`, 560, 830);
  g.fillStyle = '#64748b'; g.font = '30px system-ui'; g.fillText(`${n.effort} effort points · moves the road to launch in mission control`, 50, 876);
  const a = n.alerts[0]; const blink = !a || a[0] !== 'bad' || Math.floor(t * 2) % 2 === 0;
  g.fillStyle = a ? (a[0] === 'bad' ? (blink ? '#7f1d1d' : '#450a0a') : '#78350f') : '#052e16'; g.fillRect(50, 915, 1400, 100);
  g.fillStyle = a ? '#fff' : '#86efac'; g.font = '700 50px system-ui'; g.textAlign = 'center';
  g.fillText(a ? a[1] + (n.alerts.length > 1 ? `  (+${n.alerts.length - 1} more)` : '') : 'FITS · READY FOR THE NEXT BUILDING', 750, 983); g.textAlign = 'left';
  btex.needsUpdate = true;
}
// scale read-out on the floor
const sc = document.createElement('canvas'); sc.width = 768; sc.height = 160; const sg = sc.getContext('2d');
const stex = new THREE.CanvasTexture(sc); stex.colorSpace = THREE.SRGBColorSpace;
const scaleP = new THREE.Mesh(new THREE.PlaneGeometry(2.6, .54), new THREE.MeshBasicMaterial({ map: stex })); scaleP.position.set(SAT_X, .42, 2.5); scaleP.rotation.x = -.9; scene.add(scaleP);
function paintScale(n) { sg.fillStyle = '#020617'; sg.fillRect(0, 0, 768, 160); sg.strokeStyle = SC[n.sMass]; sg.lineWidth = 8; sg.strokeRect(4, 4, 760, 152);
  sg.fillStyle = SC[n.sMass]; sg.font = '700 96px ui-monospace, monospace'; sg.textAlign = 'center'; sg.textBaseline = 'middle'; sg.fillText(`${shown.mass.toFixed(1)} kg`, 384, 84); stex.needsUpdate = true; }

/* ---------- apply a design ---------- */
let N;
function apply(changed) {
  N = numbers(); const p = N.p;
  const defs = { propulsion: [p.propulsion.vol, p.propulsion.name, `${p.propulsion.prop} kg propellant`, p.propulsion.id],
    inst: [FIXED.inst.vol, FIXED.inst.name, 'chosen in the Research Lab', 'i'], radio: [FIXED.radio.vol, 'Radio', 'chosen in the Comms Center', 'r'],
    attitude: [p.attitude.vol, 'Attitude: ' + p.attitude.name, '', p.attitude.id], computer: [p.computer.vol, 'Computer: ' + p.computer.name, '', p.computer.id],
    battery: [p.battery.vol, `Battery ${p.battery.wh} Wh`, '', p.battery.id] };
  let y = 0;
  for (const k of ORDER) { const [vol, name, sub, id] = defs[k]; const b = blocks[k]; const h = vol / 2;
    b.ty = y; b.th = h; y += h;
    if (b.id !== id) { b.id = id; if (changed === k) b.drop = 2.6;
      const small = h < .22; b.tag.material.map?.dispose(); b.tag.material.map = label(name, small ? '' : sub, COLORS[k]); b.tag.material.needsUpdate = true; b.small = small; } }
  N.top = y;
  wings.forEach(w => { w.segs[0].t = sel.solar === 'body' ? 0 : 1; w.segs[1].t = sel.solar === 'wing2' ? 1 : 0; });
  body.visible = sel.solar === 'body';
  tracker.userData.t = sel.attitude === 'prec' ? 1 : 0;
  buildNozzles(p.propulsion.kind);
  document.querySelectorAll('.opts button').forEach(b => b.classList.toggle('on', sel[b.dataset.k] === b.dataset.id));
  if (changed) hoistT = 0;
}
let hoistT = 9;

/* ---------- tray ---------- */
const tray = document.getElementById('tray');
for (const c of CATS) {
  const bin = document.createElement('div'); bin.className = 'bin'; bin.style.setProperty('--c', c.color);
  bin.innerHTML = `<h3 style="color:${c.color}">${c.title}</h3><div class="opts">` + c.opts.map(o => {
    const extra = o.gen ? `${o.gen} W` : o.wh ? `${o.wh} Wh` : o.prop ? `${(o.mass + o.prop).toFixed(1)} kg fuelled` : `${o.mass} kg`;
    return `<button data-k="${c.key}" data-id="${o.id}">${o.name}<small>${extra} · ${o.vol ? o.vol + ' U · ' : ''}$${o.cost}M</small></button>`; }).join('') + '</div>';
  tray.appendChild(bin);
}
tray.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; sel[b.dataset.k] = b.dataset.id; apply(b.dataset.k); });

/* ---------- interaction + loop ---------- */
let spin = -.45, drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, s: spin }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (drag) spin = drag.s + (e.clientX - drag.x) * .008; });
canvas.addEventListener('pointerup', () => { drag = null; });
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.position.set(.9, 3.3, 12.2 * Math.max(1, 1.7 / camera.aspect)); camera.lookAt(.9, 1.55, 0); camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); apply();
Object.assign(shown, { mass: N.mass, vol: N.vol, used: N.used, gen: N.gen, cost: N.cost });
for (const k of ORDER) { blocks[k].y = blocks[k].ty; blocks[k].h = blocks[k].th; }
wings.forEach(w => w.segs.forEach(s => s.k = s.t));

const clock = new THREE.Clock(); let T = 0;
function tick() {
  const dt = Math.min(.05, clock.getDelta()); T += dt; const a = 1 - Math.exp(-dt * 7);
  for (const k of ['mass', 'vol', 'used', 'gen', 'cost']) shown[k] += (N[k] - shown[k]) * a;
  for (const k of ORDER) { const b = blocks[k]; b.y += (b.ty - b.y) * a; b.h += (b.th - b.h) * a; b.drop += (0 - b.drop) * (1 - Math.exp(-dt * 5));
    b.g.position.y = b.y + b.h / 2 + b.drop; b.mesh.scale.y = Math.max(.01, b.h - .03);
    const th = Math.min(.45, Math.max(.08, b.h - .06)); b.tag.scale.set(th / .45, th / .45, 1);
    b.mesh.material.emissive.set(b.y + b.h > 3.02 ? '#ef4444' : COLORS[k]); b.mesh.material.emissiveIntensity = b.y + b.h > 3.02 ? .7 + .3 * Math.sin(T * 8) : .12; }
  const top = blocks.battery.y + blocks.battery.h; over.visible = top > 3.02;
  if (over.visible) { over.scale.y = top - 3; over.position.y = 3 + (top - 3) / 2; over.material.opacity = .25 + .15 * Math.sin(T * 8); }
  const bad = N.alerts.some(x => x[0] === 'bad'); const col = bad ? '#ef4444' : N.alerts.length || [N.sMass, N.sVol, N.sPow].includes('warn') ? '#f59e0b' : '#22c55e';
  ringMat.color.set(col); frameMat.color.set(N.sVol === 'bad' ? '#ef4444' : '#7dd3fc');
  rim.color.set(bad ? '#ef4444' : '#f59e0b'); rim.intensity = bad ? 40 + 25 * Math.sin(T * 6) : 30;
  wings.forEach(w => w.segs.forEach((s, i) => { s.k += (s.t - s.k) * (1 - Math.exp(-dt * (i ? 3 : 4))); s.s.scale.x = Math.max(.001, s.k); s.s.visible = s.k > .01;
    if (i === 0) w.w.rotation.y = w.sx * (1 - s.k) * 1.4; }));
  const tk = tracker.userData; tk.k = (tk.k ?? tk.t) + (tk.t - (tk.k ?? tk.t)) * a; tracker.scale.setScalar(Math.max(.001, tk.k)); tracker.visible = tk.k > .02;
  const ion = N.p.propulsion.kind === 'ion'; const okThrust = N.thrust >= 56;
  glow.intensity = ion ? (okThrust ? 6 + Math.sin(T * 5) : (Math.sin(T * 14) > .6 ? 4 : 0)) : 0;
  cellMat.emissiveIntensity = N.sPow === 'bad' ? .15 + .15 * Math.sin(T * 9) : .5;
  hoistT += dt; const hk = Math.max(0, 1 - hoistT / 1.1); const hy = 3.6 + N.top * 0 + 2.2 * (1 - hk) ; // hook rises after a drop
  hook.position.y = hy; cable.scale.y = 6.75 - hy; cable.position.y = (6.75 + hy) / 2;
  if (!drag) spin += (Math.sin(T * .25) * .08 - .45 - spin) * dt * .3;
  turn.rotation.y = spin;
  paintBoard(N, T); paintScale(N);
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
tick();
</script>
